plugins {
    id 'com.android.application'
}

android {
    namespace 'app.swipesort'
    compileSdk 34

    defaultConfig {
        applicationId 'app.swipesort'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName '1.5.1'
    }

    sourceSets {
        // Aset WebView diambil langsung dari aplikasi web di webapp/
        main {
            assets.srcDirs += ['../../webapp']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
