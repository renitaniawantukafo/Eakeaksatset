name: Build APK

on:
  push:
    branches:
      - main
      - master
      - "claude/**"
    paths:
      - "webapp/**"
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SwipeSort-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwipeSort-debug-apk
          path: SwipeSort-debug.apk

      # Push APK ke branch apk-dist agar mudah diunduh tanpa masuk halaman Actions
      - name: Publish APK to apk-dist branch
        run: |
          mkdir -p /tmp/apk-dist
          cp SwipeSort-debug.apk /tmp/apk-dist/
          cd /tmp/apk-dist
          cat > README.md <<'EOF'
          # SwipeSort — APK terbaru

          Unduh `SwipeSort-debug.apk` lalu pasang di Android
          (izinkan "install dari sumber tidak dikenal" saat diminta).

          Branch ini dibuat otomatis oleh GitHub Actions dari setiap build.
          EOF
          git init -b apk-dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "APK build dari ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-dist
